name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure private module access
        run: |
          echo "machine github.com login x-access-token password $GITHUB_TOKEN" >> ~/.netrc
          chmod 600 ~/.netrc
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false  # set to true and uncomment below for real CI caching
          # cache-dependency-path: go.sum

      - name: Tidy
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run