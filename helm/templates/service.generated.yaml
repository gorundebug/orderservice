apiVersion: v1
kind: Service
metadata:
  name: {{ include "orderservice.fullname" . }}
  labels:
    {{ include "orderservice.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{ include "orderservice.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
{{- if eq .Values.workloadType "StatefulSet" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-headless" (include "orderservice.fullname" .) }}
  labels:
    {{ include "orderservice.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{ include "orderservice.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
{{- end }}