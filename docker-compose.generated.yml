services:
  orderservice:
    image: orderservice:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        GOPROXY: ${GOPROXY:-direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
        RUNTIME_STRIP: ${RUNTIME_STRIP:-ON}
        DEPENDENCY_GITHUB_RAW_URL: ${DEPENDENCY_GITHUB_RAW_URL:-https://github.com}
        DEPENDENCY_APT_DEBIAN_URL: ${DEPENDENCY_APT_DEBIAN_URL:-}
        DEPENDENCY_APT_DEBIAN_SECURITY_URL: ${DEPENDENCY_APT_DEBIAN_SECURITY_URL:-}
      additional_contexts:
        servicelib-source: "${GOSERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/servicelib.git#v0.2.27}"
        module-inventory_service_api-source: "${INVENTORY_SERVICE_API_SOURCE_CONTEXT:-https://github.com/gorundebug/inventory_service_api.git#v0.2.14}"
        module-model-source: "${MODEL_SOURCE_CONTEXT:-https://github.com/gorundebug/model.git#v0.2.14}"
        module-order_service_api-source: "${ORDER_SERVICE_API_SOURCE_CONTEXT:-https://github.com/gorundebug/order_service_api.git#v0.2.14}"
    environment:
      - DEBUG=${DEBUG:-0}
    ports:
      - "9091:9091"
      - "9201:9201"
      - "2345:2345"