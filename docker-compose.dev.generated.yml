services:
  orderservice:
    image: orderservice-development:local
    build:
      target: development
    working_dir: /workspace/service
    command:
      - /bin/sh
      - -c
      - |
        prepare-local-build /workspace/source /workspace/service
        if [ "$${DEBUG:-0}" = "1" ]; then
          exec dlv debug ./cmd/service/main.go --headless --listen=:2345 --api-version=2 --accept-multiclient --allow-non-terminal-interactive=true -- -config ./config/config.yaml -values ./config/overrides.yaml
        fi
        exec go run ./cmd/service/main.go -config ./config/config.yaml -values ./config/overrides.yaml
    ports:
      - "${DEBUG_PORT:-2345}:2345"
    volumes:
      - .:/workspace/source:ro
      - go-worktree:/workspace/service
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build

volumes:
  go-worktree:
  go-mod:
  go-build: